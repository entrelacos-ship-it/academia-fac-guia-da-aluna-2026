    <script>
      /* Shield against cross-origin CSSStyleSheet SecurityError thrown by html-to-image/dom-to-image */
      (function() {
        try {
          var descriptor = Object.getOwnPropertyDescriptor(CSSStyleSheet.prototype, 'cssRules');
          if (descriptor && descriptor.get) {
            var originalGet = descriptor.get;
            Object.defineProperty(CSSStyleSheet.prototype, 'cssRules', {
              get: function() {
                try {
                  return originalGet.call(this);
                } catch (e) {
                  return null;
                }
              },
              configurable: true,
              enumerable: descriptor.enumerable
            });
          }
        } catch (_) {}
      })();
    </script>
